  <text x="40" y="275" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="700">3. Tab. Amlodipine</text>
  <text x="240" y="275" fill="#B45309" font-family="system-ui, sans-serif" font-size="12">2.5 mg once daily, morning (BP control)</text>
