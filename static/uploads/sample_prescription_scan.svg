  <text x="40" y="348" fill="#475569" font-family="system-ui, sans-serif" font-size="11">1. Test first morning urine with dipstick daily. 2. No added salt in food.</text>
  <text x="40" y="366" fill="#475569" font-family="system-ui, sans-serif" font-size="11">3. Check BP once weekly. 4. Bring diary and report on Tuesday clinic visit.</text>
