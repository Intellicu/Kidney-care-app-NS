  <text x="240" y="195" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12">20 mg once daily, morning (with breakfast)</text>
  <text x="450" y="195" fill="#15803D" font-family="system-ui, sans-serif" font-size="11" font-weight="700">✓ Verified</text>
